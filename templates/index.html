<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wakacje już wkrótce!</title>

  <!-- Czcionki Google: Playfair Display (nagłówek) + DM Sans (cyfry) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;500&display=swap" rel="stylesheet" />

  <!-- Arkusz stylów -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>

  <!-- TŁO – fale SVG -->
  <div class="waves" aria-hidden="true">
    <svg viewBox="0 0 1440 320" preserveAspectRatio="none">
      <path d="M0,160 C360,260 1080,60 1440,160 L1440,320 L0,320 Z" />
    </svg>
  </div>

  <!-- GŁÓWNA KARTA -->
  <main class="card">

    <!-- Ikona słońca (czyste CSS/SVG – bez zewnętrznych zasobów) -->
    <div class="sun" aria-hidden="true">
      <div class="sun__core"></div>
      <!-- 8 promieni generowanych przez CSS -->
    </div>

    <!-- Nagłówek – zmieniany przez JS po nadejściu wakacji -->
    <h1 id="headline" class="headline">Wakacje już wkrótce!</h1>

    <!-- Odliczanie – sekcja ukrywana po nadejściu wakacji -->
    <section id="countdown" class="countdown" aria-label="Odliczanie do wakacji">

      <!-- Każda jednostka czasu -->
      <div class="unit">
        <span id="days" class="unit__value">00</span>
        <span class="unit__label">dni</span>
      </div>

      <div class="separator" aria-hidden="true">:</div>

      <div class="unit">
        <span id="hours" class="unit__value">00</span>
        <span class="unit__label">godzin</span>
      </div>

      <div class="separator" aria-hidden="true">:</div>

      <div class="unit">
        <span id="minutes" class="unit__value">00</span>
        <span class="unit__label">minut</span>
      </div>

      <div class="separator" aria-hidden="true">:</div>

      <div class="unit">
        <span id="seconds" class="unit__value">00</span>
        <span class="unit__label">sekund</span>
      </div>

    </section>

    <!-- Pasek postępu – pokazuje ile dni minęło od 1 stycznia do wakacji -->
    <div class="progress-wrap" aria-label="Postęp roku">
      <div id="progress-bar" class="progress-bar"></div>
    </div>
    <p class="progress-label" id="progress-label"></p>

  </main>

  <!-- SKRYPT ODLICZANIA -->
  <script>
    // Data wakacji wstrzyknięta przez Flask (format ISO 8601)
    const WAKACJE = new Date("{{ wakacje_iso }}");

    // Referencje do elementów DOM
    const headline   = document.getElementById("headline");
    const countdown  = document.getElementById("countdown");
    const elDays     = document.getElementById("days");
    const elHours    = document.getElementById("hours");
    const elMinutes  = document.getElementById("minutes");
    const elSeconds  = document.getElementById("seconds");
    const progressBar   = document.getElementById("progress-bar");
    const progressLabel = document.getElementById("progress-label");

    /**
     * Formatuje liczbę do dwóch cyfr (np. 5 → "05").
     * @param {number} n
     * @returns {string}
     */
    function pad(n) {
      return String(n).padStart(2, "0");
    }

    /**
     * Główna funkcja aktualizująca licznik.
     * Wywoływana co sekundę przez setInterval.
     */
    function tick() {
      const now  = new Date();
      const diff = WAKACJE - now; // różnica w milisekundach

      if (diff <= 0) {
        // ── Wakacje się zaczęły! ──────────────────────────────
        headline.textContent = "Wakacje właśnie się zaczęły! 🌊";
        headline.classList.add("started");
        countdown.classList.add("hidden");       // ukryj licznik
        progressBar.style.width = "100%";
        progressLabel.textContent = "Czas na odpoczynek!";
        return; // zatrzymaj dalsze obliczenia
      }

      // ── Obliczanie składowych czasu ───────────────────────
      const totalSec = Math.floor(diff / 1000);
      const days    = Math.floor(totalSec / 86400);
      const hours   = Math.floor((totalSec % 86400) / 3600);
      const minutes = Math.floor((totalSec % 3600)  / 60);
      const seconds = totalSec % 60;

      // Aktualizacja wyświetlanych wartości
      elDays.textContent    = pad(days);
      elHours.textContent   = pad(hours);
      elMinutes.textProperty = pad(hours); // – nadpisane poniżej
      elMinutes.textContent = pad(minutes);
      elSeconds.textContent = pad(seconds);

      // ── Pasek postępu ──────────────────────────────────────
      // Obliczamy postęp jako % czasu od 1 stycznia do daty wakacji
      const yearStart = new Date(WAKACJE.getFullYear(), 0, 1);
      const totalSpan = WAKACJE - yearStart;               // cały zakres
      const elapsed   = now - yearStart;                   // ile minęło
      const pct = Math.min(100, Math.max(0, (elapsed / totalSpan) * 100));
      progressBar.style.width = pct.toFixed(1) + "%";
      progressLabel.textContent = `Rok minął w ${pct.toFixed(0)}%`;
    }

    // Pierwsze wywołanie natychmiast + odświeżanie co 1 sekundę
    tick();
    setInterval(tick, 1000);
  </script>

</body>
</html>
